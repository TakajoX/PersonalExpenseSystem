version: '3.8'

services:
  db:
    image: postgres:15
    container_name: personal_expense_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: spese_db
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expense_network

volumes:
  postgres_data:

networks:
  expense_network:
    external: true